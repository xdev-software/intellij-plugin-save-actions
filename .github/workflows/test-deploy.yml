name: Test Deployment

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Update/Generify version + Changelog
        run: |
          originalVersion=$(grep -Po 'pluginVersion=\K.*' gradle.properties)
          newVersion="$(echo $originalVersion | cut -d '-' -f1).$( date -u '+%Y%m%d%H%M%S')-SNAPSHOT"
          echo "New version: $newVersion"
          sed -i "s/pluginVersion=$originalVersion/pluginVersion=$newVersion/" gradle.properties

          echo "Contents of gradle.properties"
          cat gradle.properties

          echo "_Please note that this is a SNAPSHOT which might be unstable_" > current-changelog.md
          echo "" >> current-changelog.md
          awk -v ver="$version" '/^# / { if (p) { exit }; if ($2 == ver) { p=1; next } } p' CHANGELOG.md >> current-changelog.md
          echo "" >> current-changelog.md
          echo "[Full changelog](https://github.com/${{ github.repository }}/blob/develop/CHANGELOG.md)" >> current-changelog.md

          cat current-changelog.md

      - name: Convert changelog to HTML
        uses: docker://pandoc/core:3
        with:
          args: >-
            -f markdown
            current-changelog.md
            current-changelog.html

      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_MARKETPLACE_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.JETBRAINS_MARKETPLACE_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_MARKETPLACE_PRIVATE_KEY_PASSWORD }}
          CHANGE_NOTES_HTML_FILE: current-changelog.html
        run: ./gradlew publishPlugin --info --stacktrace

      - name: Upload plugin files
        uses: actions/upload-artifact@v7
        with:
          name: plugin-files-java-${{ matrix.java }}
          path: build/distributions/*
          if-no-files-found: error
